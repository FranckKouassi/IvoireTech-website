<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- IvTech Solutions — Favicon (32x32 / 64x64) -->
  <!-- Version simplifiée du symbole pour petites tailles -->

  <g transform="translate(8, 4)">
    <!-- Simplified hexagon -->
    <polygon points="24,0 46,10 46,38 24,48 2,38 2,10"
             fill="#1B3A5C" fill-opacity="0.1" stroke="#1B3A5C" stroke-width="0.8" stroke-opacity="0.2"/>

    <!-- Forehead -->
    <path d="M 24 8 L 16 18 L 32 18 Z" fill="#1B3A5C" opacity="0.85"/>

    <!-- Left ear orange -->
    <path d="M 16 18 L 7 16 L 6 30 L 13 26 Z" fill="#FF8C00" opacity="0.75"/>
    <!-- Right ear green -->
    <path d="M 32 18 L 41 16 L 42 30 L 35 26 Z" fill="#009E60" opacity="0.75"/>

    <!-- Face -->
    <path d="M 16 18 L 13 26 L 18 30 L 24 24 L 30 30 L 35 26 L 32 18 Z" fill="#1B3A5C" opacity="0.6"/>

    <!-- Trunk -->
    <path d="M 22 24 L 21 34 L 20 40 L 22 43 L 24 40 L 26 43 L 28 40 L 27 34 L 26 24 Z" fill="#1B3A5C" opacity="0.5"/>

    <!-- Eyes -->
    <circle cx="20" cy="21" r="1.8" fill="#FFFFFF"/><circle cx="20" cy="21" r="1.1" fill="#2E86DE"/>
    <circle cx="28" cy="21" r="1.8" fill="#FFFFFF"/><circle cx="28" cy="21" r="1.1" fill="#2E86DE"/>

    <!-- Left tusk "I" — curved, orange -->
    <path d="M 14 26 C 10 32, 8 38, 9 44" fill="none" stroke="#FF8C00" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Right tusk "T" — curved + crossbar, green -->
    <path d="M 34 26 C 38 32, 40 38, 39 44" fill="none" stroke="#009E60" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="31" y1="26" x2="40" y2="26" stroke="#009E60" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Forehead dot -->
    <circle cx="24" cy="12" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>