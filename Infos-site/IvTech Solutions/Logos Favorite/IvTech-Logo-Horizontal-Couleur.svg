<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <!-- IvTech Solutions — Logo Final : Tricolor Shield -->
  <!-- Version : Horizontale Couleur (principale) -->

  <g transform="translate(8, 5)">
    <!-- Hexagonal shield -->
    <polygon points="75,2 138,32 138,112 75,142 12,112 12,32"
             fill="#1B3A5C" fill-opacity="0.08" stroke="#1B3A5C" stroke-width="1.8" stroke-opacity="0.25"/>

    <!-- Subtle tricolor bands -->
    <clipPath id="hcMain">
      <polygon points="75,2 138,32 138,112 75,142 12,112 12,32"/>
    </clipPath>
    <g clip-path="url(#hcMain)">
      <rect x="12" y="0" width="42" height="145" fill="#FF8C00" opacity="0.04"/>
      <rect x="96" y="0" width="42" height="145" fill="#009E60" opacity="0.04"/>
    </g>

    <!-- Elephant forehead -->
    <path d="M 75 22 L 50 52 L 100 52 Z" fill="#1B3A5C" opacity="0.85"/>

    <!-- Left ear — ORANGE -->
    <path d="M 50 52 L 22 46 L 19 88 L 40 77 Z" fill="#FF8C00" opacity="0.75"/>

    <!-- Right ear — GREEN -->
    <path d="M 100 52 L 128 46 L 131 88 L 110 77 Z" fill="#009E60" opacity="0.75"/>

    <!-- Face/cheeks -->
    <path d="M 50 52 L 40 77 L 54 92 L 75 74 L 96 92 L 110 77 L 100 52 Z"
          fill="#1B3A5C" opacity="0.6"/>

    <!-- Trunk -->
    <path d="M 67 74 L 63 102 L 60 122 L 67 130 L 75 122 L 83 130 L 90 122 L 87 102 L 83 74 Z"
          fill="#1B3A5C" opacity="0.5"/>

    <!-- Eyes -->
    <circle cx="62" cy="62" r="4.5" fill="#FFFFFF"/>
    <circle cx="62" cy="62" r="2.8" fill="#2E86DE"/>
    <circle cx="88" cy="62" r="4.5" fill="#FFFFFF"/>
    <circle cx="88" cy="62" r="2.8" fill="#2E86DE"/>

    <!-- LEFT TUSK = "I" — curved (style Tusk Monogram), orange -->
    <path d="M 46 87 C 34 100, 26 114, 30 132" fill="none" stroke="#FF8C00" stroke-width="4.8" stroke-linecap="round"/>

    <!-- RIGHT TUSK = "T" — curved + crossbar (style Tusk Monogram), green -->
    <path d="M 104 87 C 116 100, 124 114, 120 132" fill="none" stroke="#009E60" stroke-width="4.8" stroke-linecap="round"/>
    <line x1="96" y1="87" x2="124" y2="87" stroke="#009E60" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Forehead accent — white diamond with blue data glow (NO "IvT" text) -->
    <circle cx="75" cy="36" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="75" cy="36" r="1.5" fill="#2E86DE" opacity="0.7"/>

    <!-- Circuit nodes in ears -->
    <circle cx="28" cy="58" r="1.8" fill="#FFFFFF" opacity="0.4"/>
    <line x1="28" y1="58" x2="38" y2="67" stroke="#FFFFFF" stroke-width="0.7" opacity="0.3"/>
    <circle cx="122" cy="58" r="1.8" fill="#FFFFFF" opacity="0.4"/>
    <line x1="122" y1="58" x2="112" y2="67" stroke="#FFFFFF" stroke-width="0.7" opacity="0.3"/>

    <!-- Base tricolor data nodes -->
    <circle cx="42" cy="138" r="2.5" fill="#FF8C00" opacity="0.4"/>
    <circle cx="75" cy="140" r="2.5" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="0.5" opacity="0.45"/>
    <circle cx="110" cy="138" r="2.5" fill="#009E60" opacity="0.4"/>
    <line x1="42" y1="138" x2="75" y2="140" stroke="#1B3A5C" stroke-width="0.8" opacity="0.15"/>
    <line x1="75" y1="140" x2="110" y2="138" stroke="#1B3A5C" stroke-width="0.8" opacity="0.15"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(190, 18)">
    <text x="0" y="52" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="54" font-weight="700" letter-spacing="1">
      <tspan fill="#FF8C00">I</tspan><tspan fill="#1B3A5C">v</tspan><tspan fill="#1B3A5C">Tech</tspan>
    </text>
    <!-- Tricolor separator line -->
    <line x1="0" y1="58" x2="75" y2="58" stroke="#FF8C00" stroke-width="2"/>
    <line x1="75" y1="58" x2="150" y2="58" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="150" y1="58" x2="225" y2="58" stroke="#009E60" stroke-width="2"/>
    <text x="2" y="80" font-family="'Montserrat', 'Arial', sans-serif" font-size="21" font-weight="300" fill="#2C3E50" letter-spacing="8">SOLUTIONS</text>
  </g>
</svg>